<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Términos Comunes en Consultoría B2B</title>
</head>

<body>
    <header>
        <h1>Términos Comunes en Consultoría B2B</h1>
    </header>

    <main>
        <form id="quiz">

            <!-- Pregunta 1: respuesta escrita con pista -->
            <fieldset>
                <legend>1. ¿Qué significa JTBD?</legend>
                <input type="text" id="q1" name="q1">
                <details>
                    <summary>Mostrar pista</summary>
                    <p>Jobs to be done</p>
                </details>
            </fieldset>

            <!-- Pregunta 2: una sola respuesta -->
            <fieldset>
                <legend>2. ¿Qué significa Azimut?</legend>
                <label><input type="radio" name="q2" value="a"> Una prueba psicométrica</label><br>
                <label><input type="radio" name="q2" value="b"> Tu enfoque en el desarrollo de los clientes</label><br>
                <label><input type="radio" name="q2" value="c"> Un método de ventas</label><br>
                <label><input type="radio" name="q2" value="d"> El resultado de una prueba psicométrica</label>
            </fieldset>

            <!-- Pregunta 3: varias respuestas correctas -->
            <fieldset>
                <legend>3. ¿Qué significa Meddpicc?</legend>
                <label><input type="checkbox" name="q3" value="a"> Metrics</label><br>
                <label><input type="checkbox" name="q3" value="b"> Decision Maker</label><br>
                <label><input type="checkbox" name="q3" value="c"> Economic Buyer</label><br>
                <label><input type="checkbox" name="q3" value="d"> Decision Criteria</label><br>
                <label><input type="checkbox" name="q3" value="e"> Established Buyer</label><br>
                <label><input type="checkbox" name="q3" value="f"> Decision Process</label><br>
                <label><input type="checkbox" name="q3" value="g"> Paper Process</label><br>
                <label><input type="checkbox" name="q3" value="h"> Process</label><br>
                <label><input type="checkbox" name="q3" value="i"> Identify Pain</label><br>
                <label><input type="checkbox" name="q3" value="j"> Champion</label><br>
                <label><input type="checkbox" name="q3" value="k"> Campeón</label><br>
                <label><input type="checkbox" name="q3" value="l"> Competition</label>
            </fieldset>

            <!-- Pregunta 4: una sola respuesta -->
            <fieldset>
                <legend>4. ¿Qué significa "tab"?</legend>
                <label><input type="radio" name="q4" value="a"> Tabla</label><br>
                <label><input type="radio" name="q4" value="b"> Tablar</label><br>
                <label><input type="radio" name="q4" value="c"> Pestaña</label><br>
                <label><input type="radio" name="q4" value="d"> Tocar</label>
            </fieldset>

            <button type="button" id="check-btn">Revisar respuestas</button>
        </form>
    </main>
</body>

</html>
