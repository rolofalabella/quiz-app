<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminos Comunes en Consultoria B2B</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Términos Comunes en Consultoría B2B</h1>
    </header>

    <main>
        <form id="quiz">

            <!-- Pregunta 1. respuesta escrito con pista -->
            <fieldset>
                <legend>1. ¿Qué significa JTBD?</legend>
                <input type="text" id="q1" name="q1">
                <details>
                    <summary>Mostrar pista</summary>
                    <p>Jobs to be done</p>
                </details>
            </fieldset>

            <!-- Pregunta 2: una sola respuesta -->
            <fieldset>
                <legend>2. ¿Qué significa Azimut?</legend>
                <label><input type="radio" name="q2" value="a"> Una prueba psicométrica</label>
                <label><input type="radio" name="q2" value="b"> Tu enfoque en el desarrollo de los clientes</label>
                <label><input type="radio" name="q3" value="c"> Un método de ventas</label>
                <label><input type="radio" name="q4" value="d"> El resultado de una prueba psicometrica</label>
            </fieldset>

            <!-- Pregunta 3: varias respuestas correctas -->
            <fieldset>
                <legend>3. ¿Qué significa Meddpicc?</legend>
                <label><input type="checkbox" name="q3" value="a"> Metrics</label>
                <label><input type="checkbox" name="q3" value="b"> Decision Maker</label>
                <label><input type="checkbox" name="q3" value="c"> Economic Buyer</label>
                <label><input type="checkbox" name="q3" value="d"> Decision Criteria</label>
                <label><input type="checkbox" name="q3" value="e"> Established Buyer</label>
                <label><input type="checkbox" name="q3" value="f"> Decision Process</label>
                <label><input type="checkbox" name="q3" value="g"> Paper Process</label>
                <label><input type="checkbox" name="q3" value="h"> Process</label>
                <label><input type="checkbox" name="q3" value="i"> Identify Pain</label>
                <label><input type="checkbox" name="q3" value="j"> Champion</label>
                <label><input type="checkbox" name="q3" value="k"> Campeón</label>
                <label><input type="checkbox" name="q3" value="l"> Competition</label>
            </fieldset>

            <!-- Pregunta 4: uan sola respuesta -->
            <fieldset>
                <legend>4. ¿Qué significa "tab"</legend>
                <label><input type="radio" name="q4" value="a"> Tabla</label>
                <label><input type="radio" name="q4" value="b"> Tablar</label>
                <label><input type="radio" name="q4" value="c"> Pestaña</label>
                <label><input type="radio" name="q4" value="d"> Tocar</label>
            </fieldset>

            <!-- Pregunta 5: ¿Cuál es el nombre de la plataforma que usas? -->
            <fieldset>
                <legend>5. ¿Cuál es el nombre de la plataforma que usas?</legend>
                <input type="text" id="q5" name="q5">
            </fieldset>

            <button type="button" id="check-btn"> Revisar respuestas</button>
        </form>
    </main>
</body>

</html>
